<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skybreakers Bingo — Admin</title>
    <link rel="icon" href="https://cdn.discordapp.com/icons/1386222769238315120/e491d2ab03e0cb29ebaa095359ce1265.webp?size=32&quality=lossless">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Fira+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0a0a0f; --surface: #13131a; --tile-bg: #1c1c28;
            --tile-border: #2a2a3a; --accent: #f0c040;
            --accent-glow: rgba(240,192,64,0.3); --accent-dim: #b8912e;
            --text: #d4d4dc; --text-muted: #6a6a7a;
            --danger: #c0392b; --success: #27ae60;
            --font-display: 'Cinzel', serif; --font-body: 'Fira Sans', sans-serif;
        }
        body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; }
        body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(ellipse at 20% 50%, rgba(240,192,64,0.03) 0%, transparent 50%), radial-gradient(ellipse at 80% 20%, rgba(100,80,200,0.03) 0%, transparent 50%); }
        .container { position: relative; z-index: 1; max-width: 780px; margin: 0 auto; padding: 24px 16px; }
        .header { text-align: center; margin-bottom: 32px; }
        .header h1 { font-family: var(--font-display); font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 900; color: var(--accent); letter-spacing: 0.06em; text-shadow: 0 0 30px var(--accent-glow), 0 2px 4px rgba(0,0,0,0.5); }
        .header .subtitle { font-size: 0.8rem; color: var(--danger); margin-top: 6px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; }
        .back-link { display: inline-block; color: var(--text-muted); text-decoration: none; font-size: 0.85rem; margin-bottom: 20px; transition: color 0.2s; }
        .back-link:hover { color: var(--accent); }

        .team-list { display: flex; flex-direction: column; gap: 20px; }
        .team-card { background: var(--surface); border: 1px solid var(--tile-border); border-radius: 10px; padding: 20px; transition: border-color 0.2s; }
        .team-card.expanded { border-color: var(--accent-dim); }
        .team-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; gap: 8px; flex-wrap: wrap; }
        .team-info h3 { font-family: var(--font-display); font-size: 1rem; color: var(--accent); margin-bottom: 4px; }
        .team-meta { font-size: 0.78rem; color: var(--text-muted); }
        .team-meta span { margin-right: 12px; }
        .team-meta .code { font-family: monospace; letter-spacing: 0.1em; color: var(--text); background: var(--tile-bg); padding: 1px 6px; border-radius: 3px; }
        .team-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .expand-hint { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; }

        .admin-board-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--tile-border); display: none; }
        .team-card.expanded .admin-board-section { display: block; }

        .chain-controls { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
        .chain-controls label { font-size: 0.78rem; color: var(--text-muted); }
        .chain-controls input[type="number"] { width: 60px; padding: 6px 8px; background: var(--tile-bg); border: 1px solid var(--tile-border); border-radius: 4px; color: var(--text); font-size: 0.85rem; text-align: center; }
        .chain-controls input[type="number"]:focus { border-color: var(--accent-dim); outline: none; }

        .board-legend { display: flex; gap: 16px; margin-bottom: 12px; font-size: 0.72rem; color: var(--text-muted); flex-wrap: wrap; }
        .board-legend .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
        .swatch-hidden { background: var(--tile-bg); border: 1px solid var(--tile-border); }
        .swatch-revealed { background: var(--accent-dim); }
        .swatch-completed { background: var(--success); }

        .admin-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 12px; }
        .admin-tile {
            aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center;
            justify-content: center; text-align: center; font-size: clamp(0.5rem, 1.6vw, 0.72rem);
            font-weight: 600; padding: 4px 3px; position: relative;
            transition: all 0.2s; line-height: 1.25; user-select: none;
        }
        .admin-tile.state-hidden { background: var(--tile-bg); border: 1px solid var(--tile-border); color: var(--text-muted); }
        .admin-tile.state-revealed { background: rgba(184,145,46,0.15); border: 1px solid var(--accent-dim); color: var(--accent); }
        .admin-tile.state-completed { background: rgba(39,174,96,0.15); border: 1px solid var(--success); color: var(--success); }
        .admin-tile .chain-label { position: absolute; top: 2px; left: 3px; font-size: 0.45rem; opacity: 0.5; font-family: monospace; }
        .admin-tile .state-label { position: absolute; bottom: 2px; right: 3px; font-size: 0.5rem; opacity: 0.5; }

        .btn { padding: 8px 16px; font-size: 0.8rem; font-weight: 600; font-family: var(--font-body); cursor: pointer; border: none; border-radius: 5px; transition: all 0.2s; }
        .btn-reveal { background: transparent; color: var(--accent); border: 1px solid var(--accent-dim); }
        .btn-reveal:hover { background: var(--accent); color: var(--bg); }
        .btn-reset { background: transparent; color: var(--accent); border: 1px solid var(--accent-dim); }
        .btn-reset:hover { background: var(--accent); color: var(--bg); }
        .btn-delete { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .btn-delete:hover { background: var(--danger); color: white; }
        .btn-nuke { padding: 12px 24px; font-size: 0.9rem; font-weight: 700; background: transparent; color: var(--danger); border: 2px solid var(--danger); font-family: var(--font-body); cursor: pointer; border-radius: 6px; transition: all 0.2s; margin-top: 24px; width: 100%; }
        .btn-nuke:hover { background: var(--danger); color: white; }
        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); font-style: italic; }

        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--surface); border: 1px solid var(--accent-dim); color: var(--text); padding: 12px 24px; border-radius: 8px; font-size: 0.85rem; z-index: 999; transition: transform 0.3s ease; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .toast.show { transform: translateX(-50%) translateY(0); }

        @media (max-width: 480px) { .team-header { flex-direction: column; align-items: flex-start; } .admin-board { gap: 4px; } .admin-tile { font-size: 0.45rem; padding: 3px 2px; } }

        /* FREE TASKS SECTION */
        .section { background: var(--surface); border: 1px solid var(--tile-border); border-radius: 10px; padding: 20px; margin-bottom: 28px; }
        .section h2 { font-family: var(--font-display); font-size: 1rem; color: var(--accent); margin-bottom: 4px; letter-spacing: 0.06em; }
        .section-sub { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 16px; }
        .free-task-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
        .free-task-row { display: flex; align-items: center; gap: 8px; }
        .free-task-row input { flex: 1; padding: 9px 12px; background: var(--tile-bg); border: 1px solid var(--tile-border); border-radius: 5px; color: var(--text); font-family: var(--font-body); font-size: 0.88rem; outline: none; transition: border-color 0.2s; }
        .free-task-row input:focus { border-color: var(--accent-dim); }
        .free-task-row .btn-del { background: transparent; color: var(--danger); border: 1px solid rgba(192,57,43,0.35); border-radius: 5px; padding: 7px 11px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; flex-shrink: 0; }
        .free-task-row .btn-del:hover { background: var(--danger); color: white; border-color: var(--danger); }
        .free-add-row { display: flex; gap: 8px; margin-bottom: 14px; }
        .free-add-row input { flex: 1; padding: 9px 12px; background: var(--tile-bg); border: 1px solid var(--tile-border); border-radius: 5px; color: var(--text); font-family: var(--font-body); font-size: 0.88rem; outline: none; transition: border-color 0.2s; }
        .free-add-row input:focus { border-color: var(--accent-dim); }
        .free-add-row .btn-add { padding: 9px 18px; font-size: 0.88rem; font-weight: 600; background: transparent; color: var(--accent); border: 1px solid var(--accent-dim); border-radius: 5px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
        .free-add-row .btn-add:hover { background: var(--accent); color: var(--bg); }
        .btn-save { width: 100%; padding: 10px; font-size: 0.9rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent-dim)); color: #0a0a0f; border: none; border-radius: 6px; cursor: pointer; font-family: var(--font-body); transition: opacity 0.2s; }
        .btn-save:hover { opacity: 0.88; }

        /* LOGIN SCREEN */
        #loginScreen {
            position: fixed; inset: 0; background: var(--bg); z-index: 100;
            display: flex; align-items: center; justify-content: center; padding: 24px;
        }
        .login-box {
            background: var(--surface); border: 1px solid var(--tile-border);
            border-radius: 12px; padding: 36px 32px; width: 100%; max-width: 360px;
            text-align: center;
        }
        .login-box h2 { font-family: var(--font-display); font-size: 1.3rem; color: var(--accent); margin-bottom: 6px; letter-spacing: 0.06em; }
        .login-box p { font-size: 0.78rem; color: var(--text-muted); margin-bottom: 24px; }
        .login-box input {
            width: 100%; padding: 11px 14px; margin-bottom: 10px;
            background: var(--tile-bg); border: 1px solid var(--tile-border);
            border-radius: 6px; color: var(--text); font-family: var(--font-body);
            font-size: 0.9rem; outline: none; transition: border-color 0.2s;
        }
        .login-box input:focus { border-color: var(--accent-dim); }
        .login-box .btn-login {
            width: 100%; padding: 11px; font-size: 0.95rem; font-weight: 700;
            background: linear-gradient(135deg, var(--accent), var(--accent-dim));
            color: #0a0a0f; border: none; border-radius: 6px; cursor: pointer;
            font-family: var(--font-body); margin-top: 4px; transition: opacity 0.2s;
        }
        .login-box .btn-login:hover { opacity: 0.88; }
        .login-error { color: var(--danger); font-size: 0.8rem; margin-top: 10px; min-height: 18px; }
        .logout-btn {
            position: fixed; top: 14px; right: 16px; z-index: 50;
            background: transparent; border: 1px solid var(--tile-border);
            color: var(--text-muted); font-family: var(--font-body); font-size: 0.75rem;
            padding: 5px 12px; border-radius: 5px; cursor: pointer; transition: all 0.2s;
        }
        .logout-btn:hover { border-color: var(--danger); color: var(--danger); }
    </style>
</head>
<body>
<div class="container">
    <a href="index.html" class="back-link">← Back to Bingo</a>
    <header class="header">
        <h1>Skybreakers Admin</h1>
        <div class="subtitle">⚠ Full board control — handle with care</div>
    </header>

    <!-- FREE TASKS SECTION -->
    <div class="section">
        <h2>⭐ Free Tasks</h2>
        <p class="section-sub">These tasks are always visible to every team. Changes apply globally and immediately on save.</p>
        <div class="free-task-list" id="freeTaskList"></div>
        <div class="free-add-row">
            <input type="text" id="freeNewInput" placeholder="New free task..." maxlength="80" onkeydown="if(event.key==='Enter')freeAdd()">
            <button class="btn-add" onclick="freeAdd()">+ Add</button>
        </div>
        <button class="btn-save" onclick="freeSave()">💾 Save Free Tasks</button>
    </div>

    <div id="teamList" class="team-list"><div class="empty-state">Loading teams...</div></div>
    <button class="btn-nuke" onclick="deleteAllTeams()">🗑 Delete ALL Teams</button>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
    firebase.initializeApp({
        apiKey: "AIzaSyAStt7XqfP1gwXaDhFE_1Z8l35smgtCfhk",
        authDomain: "bingo-57c25.firebaseapp.com",
        databaseURL: "https://bingo-57c25-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "bingo-57c25",
        storageBucket: "bingo-57c25.firebasestorage.app",
        messagingSenderId: "198647199029",
        appId: "1:198647199029:web:af0be2b9884b748fe1087c"
    });
    const db = firebase.database();

    const auth = firebase.auth();

    // Hide everything until auth state is known
    document.querySelector('.container').style.visibility = 'hidden';

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('logoutBtn').classList.remove('hidden');
            document.querySelector('.container').style.visibility = 'visible';
            initAdmin();
        } else {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('logoutBtn').classList.add('hidden');
            document.querySelector('.container').style.visibility = 'hidden';
        }
    });

    function doLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const pw    = document.getElementById('loginPw').value;
        const errEl = document.getElementById('loginError');
        errEl.textContent = '';
        auth.signInWithEmailAndPassword(email, pw)
            .catch(err => {
                errEl.textContent = 'Incorrect email or password.';
            });
    }

    function doLogout() {
        auth.signOut();
    }

    function initAdmin() {
    const TOTAL = 25;
    const DEFAULT_TASKS = [
        "Nex Drop", "Araxxor Leg Piece", "GWD2 Unique", "Telos Orb", "Kerapac Broadcast",
        "Raksha Codex/Boots", "Croesus Cryptbloom", "Arch-Glacor Unique", "60 Fortunate Comps", "Skilling Pet",
        "Boss Pet", "Fight Kiln Cape", "Elite Dungeon Drop", "Barrows 2 Weapons", "Clue Broadcast",
        "DKS: All 4 Rings", "Matriarch Heart", "Zamorakian Drop", "Corporeal Beast Sigil", "QBD 4-piece Bow",
        "Abyssal Wand/Whip", "Dragon Mattock", "100 ED1 Scales", "Full Godsword", "Legiones Signet"
    ];

    let teamsCache = {};

    function shuffleArray(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    function escapeHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
    function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }

    db.ref('teams').on('value', snap => { teamsCache = snap.val() || {}; renderTeamList(); });

    function renderTeamList() {
        const el = document.getElementById('teamList');
        const teams = teamsCache;
        if (!Object.keys(teams).length) { el.innerHTML = '<div class="empty-state">No teams exist.</div>'; return; }

        const expanded = new Set();
        document.querySelectorAll('.team-card.expanded').forEach(c => expanded.add(c.dataset.code));

        const entries = Object.entries(teams).sort((a, b) => {
            const ca = a[1].chain ? a[1].chain.completed || 0 : 0;
            const cb = b[1].chain ? b[1].chain.completed || 0 : 0;
            return cb - ca;
        });

        el.innerHTML = entries.map(([code, data]) => {
            const tasks = data.tasks || DEFAULT_TASKS;
            const order = data.order || [...Array(TOTAL).keys()];
            const chain = data.chain || { revealed: 2, completed: 0 };
            const isExp = expanded.has(code);
            const created = data.createdAt ? new Date(data.createdAt).toLocaleDateString() : '—';

            const boardTiles = Array.from({ length: TOTAL }, (_, boardIdx) => {
                const ci = order[boardIdx];
                let stateClass, label;
                if (ci < chain.completed)      { stateClass = 'state-completed'; label = '✓'; }
                else if (ci < chain.revealed)  { stateClass = 'state-revealed';  label = '◉'; }
                else                           { stateClass = 'state-hidden';    label = '?'; }
                const letter = String.fromCharCode(65 + ci);
                return `<div class="admin-tile ${stateClass}" title="Chain: ${letter} (${ci})&#10;${escapeHtml(tasks[ci])}">
                    <span class="chain-label">${letter}</span>
                    ${escapeHtml(tasks[ci])}
                    <span class="state-label">${label}</span>
                </div>`;
            }).join('');

            return `<div class="team-card ${isExp ? 'expanded' : ''}" data-code="${code}">
                <div class="team-header" onclick="toggleExpand(this)">
                    <div class="team-info">
                        <h3>${escapeHtml(data.name)}</h3>
                        <div class="team-meta">
                            <span class="code">${code}</span>
                            <span>${chain.completed} done</span>
                            <span>${chain.revealed - chain.completed} open</span>
                            <span>${TOTAL - chain.revealed} hidden</span>
                            <span>Created ${created}</span>
                        </div>
                        <div class="expand-hint">${isExp ? '▲ Collapse' : '▼ Expand board'}</div>
                    </div>
                    <div class="team-actions" onclick="event.stopPropagation()">
                        <button class="btn btn-reveal" onclick="adminReveal('${code}')">⚔ +1 Reveal</button>
                        <button class="btn btn-reset" onclick="resetTeam('${code}', '${escapeHtml(data.name)}')">Reset</button>
                        <button class="btn btn-delete" onclick="deleteTeam('${code}', '${escapeHtml(data.name)}')">Delete</button>
                    </div>
                </div>
                <div class="admin-board-section">
                    <div class="chain-controls">
                        <label>Revealed: <input type="number" min="0" max="${TOTAL}" value="${chain.revealed}" onchange="setChain('${code}', 'revealed', this.value)"></label>
                        <label>Completed: <input type="number" min="0" max="${TOTAL}" value="${chain.completed}" onchange="setChain('${code}', 'completed', this.value)"></label>
                    </div>
                    <div class="board-legend">
                        <span><span class="swatch swatch-hidden"></span> Hidden</span>
                        <span><span class="swatch swatch-revealed"></span> Revealed</span>
                        <span><span class="swatch swatch-completed"></span> Completed</span>
                        <span style="margin-left: auto; font-style: italic;">Letter = chain position</span>
                    </div>
                    <div class="admin-board">${boardTiles}</div>
                </div>
            </div>`;
        }).join('');
    }

    function toggleExpand(headerEl) {
        const card = headerEl.closest('.team-card');
        card.classList.toggle('expanded');
        card.querySelector('.expand-hint').textContent = card.classList.contains('expanded') ? '▲ Collapse' : '▼ Expand board';
    }

    async function setChain(code, field, value) {
        let v = Math.max(0, Math.min(TOTAL, parseInt(value) || 0));
        const data = teamsCache[code];
        if (!data) return;
        const chain = data.chain || { revealed: 2, completed: 0 };

        if (field === 'completed') {
            // completed can't exceed revealed
            if (v > chain.revealed) v = chain.revealed;
            await db.ref(`teams/${code}/chain/completed`).set(v);
        } else {
            // revealed can't be less than completed
            if (v < chain.completed) v = chain.completed;
            await db.ref(`teams/${code}/chain/revealed`).set(v);
        }

        const now = Date.now();
        await db.ref(`teams/${code}/log/${now}`).set({
            action: `admin-set-${field}`, task: `${field} → ${v}`,
            time: new Date(now).toISOString(), source: 'admin'
        });
        showToast(`${field} set to ${v}`);
    }

    async function adminReveal(code) {
        const data = teamsCache[code];
        if (!data) return;
        const chain = data.chain || { revealed: 2, completed: 0 };
        if (chain.revealed >= TOTAL) { showToast('All tiles already revealed.'); return; }

        const tasks = data.tasks || DEFAULT_TASKS;
        const newRevealed = chain.revealed + 1;
        const now = Date.now();

        await db.ref(`teams/${code}`).update({
            'chain/revealed': newRevealed,
            [`log/${now}`]: { action: 'reveal', task: tasks[chain.revealed], chainIndex: chain.revealed, time: new Date(now).toISOString(), source: 'admin' }
        });
        showToast(`Revealed "${tasks[chain.revealed]}"`);
    }

    async function resetTeam(code, name) {
        if (!confirm(`Reset "${name}"? Reshuffles tasks and clears all progress.`)) return;
        const now = Date.now();
        const tasks = shuffleArray(DEFAULT_TASKS);
        const order = shuffleArray([...Array(TOTAL).keys()]);
        const log = {};
        for (let i = 0; i < 2; i++) {
            log[now + i] = { action: 'reveal', task: tasks[i], chainIndex: i, time: new Date(now + i).toISOString(), source: 'initial' };
        }
        await db.ref(`teams/${code}`).update({
            tasks, order, chain: { revealed: 2, completed: 0 },
            log, spawnedBy: null, revealed: null, completed: null,
            lastAutoReveal: now
        });
        showToast(`"${name}" has been reset.`);
    }

    async function deleteTeam(code, name) {
        if (!confirm(`Permanently delete "${name}"? Cannot be undone.`)) return;
        await db.ref(`teams/${code}`).remove();
        showToast(`"${name}" deleted.`);
    }

    async function deleteAllTeams() {
        if (!confirm('DELETE ALL TEAMS? Cannot be undone.')) return;
        if (!confirm('Really sure? Last chance.')) return;
        await db.ref('teams').remove();
        showToast('All teams deleted.');
    }
    // ═══════════════════════════════════════════
    //  FREE TASKS
    // ═══════════════════════════════════════════
    const DEFAULT_FREE_TASKS = [
        "Claim a quest cape",
        "Reach max total level",
        "Complete a 5-star Elite Dungeon"
    ];

    let freeDraft = [];

    // Load from Firebase on init
    db.ref('config/freeTasks').once('value').then(snap => {
        freeDraft = snap.val() || DEFAULT_FREE_TASKS;
        renderFreeList();
    });

    function renderFreeList() {
        const list = document.getElementById('freeTaskList');
        if (!freeDraft.length) {
            list.innerHTML = '<div style="color:var(--text-muted);font-size:0.82rem;font-style:italic;padding:4px 0;">No free tasks yet.</div>';
            return;
        }
        list.innerHTML = freeDraft.map((task, i) =>
            `<div class="free-task-row">
                <input type="text" value="${escapeHtml(task)}" oninput="freeDraft[${i}]=this.value" placeholder="Task name...">
                <button class="btn-del" onclick="freeRemove(${i})" title="Remove">✕</button>
            </div>`
        ).join('');
    }

    function freeAdd() {
        const input = document.getElementById('freeNewInput');
        const val = input.value.trim();
        if (!val) return;
        freeDraft.push(val);
        input.value = '';
        renderFreeList();
        // Focus the last added input
        const rows = document.querySelectorAll('#freeTaskList .free-task-row input');
        if (rows.length) rows[rows.length - 1].focus();
    }

    function freeRemove(i) {
        freeDraft.splice(i, 1);
        renderFreeList();
    }

    async function freeSave() {
        // Sync any inline edits from inputs before saving
        document.querySelectorAll('#freeTaskList .free-task-row input').forEach((inp, i) => {
            if (i < freeDraft.length) freeDraft[i] = inp.value.trim();
        });
        const cleaned = freeDraft.filter(t => t.length > 0);
        await db.ref('config/freeTasks').set(cleaned);
        freeDraft = cleaned;
        renderFreeList();
        showToast('✅ Free tasks saved!');
    }

    } // end initAdmin
</script>
</body>
</html>
